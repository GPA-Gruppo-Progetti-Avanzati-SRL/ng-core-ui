<h2 mat-dialog-title class="!text-base !font-semibold text-on-surface">{{ data.title }}</h2>

<mat-dialog-content>
  @if (data.isHtml) {
    <div class="m-0 text-sm leading-relaxed text-on-surface-variant" [innerHTML]="data.message"></div>
  } @else {
    <p class="m-0 text-sm leading-relaxed text-on-surface-variant">{{ data.message }}</p>
  }
</mat-dialog-content>

<!-- Focus iniziale sull'azione "sicura": Annulla per le conferme distruttive, Conferma altrimenti -->
<mat-dialog-actions align="end" class="gap-2">
  <button mat-button type="button" [mat-dialog-close]="false" [attr.cdkFocusInitial]="danger ? '' : null">
    {{ data.cancelLabel }}
  </button>
  <button
    mat-flat-button
    type="button"
    [mat-dialog-close]="true"
    [attr.cdkFocusInitial]="danger ? null : ''"
    [class.!bg-error]="danger"
    [class.!text-on-error]="danger"
  >
    {{ data.confirmLabel }}
  </button>
</mat-dialog-actions>
