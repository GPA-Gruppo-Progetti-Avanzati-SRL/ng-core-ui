<div class="px-6 pt-4 pb-2">
  <mat-form-field class="w-full" subscriptSizing="dynamic">
    <mat-label>{{ t().picker.search }}</mat-label>
    <input matInput [value]="filterText()"
      (input)="filterText.set($any($event.target).value)"
      autocomplete="off" class="!text-sm"/>
  </mat-form-field>
</div>

<div class="px-6 py-2">
  <core-datatable
    #table
    [columns]="columns()"
    [data]="filteredOptions"
    selectionMode="multi"
    [initialSelection]="preSelected()"
    [pageSizeOptions]="[]"
    [initialPageSize]="5"
  />
</div>

<div class="flex justify-end gap-2 px-6 pb-4">
  <core-button
    variant="filled"
    [label]="data.cancelLabel ?? t().picker.cancel"
    (click)="cancel()"
  />
  <core-button
    variant="filled"
    [label]="data.confirmLabel ?? t().picker.confirm"
    (click)="confirm()"
  />
</div>
