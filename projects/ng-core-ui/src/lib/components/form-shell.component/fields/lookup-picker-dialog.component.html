<div class="flex items-center justify-between px-6 pt-4 pb-2">
  <h2 mat-dialog-title class="!m-0 !p-0 text-xl text-on-surface">{{ pickerData.title ?? t().picker.title }}</h2>
  <button mat-icon-button type="button" (click)="close()" [matTooltip]="t().picker.close" [attr.aria-label]="t().picker.close">
    <mat-icon aria-hidden="true">close</mat-icon>
  </button>
</div>
<mat-dialog-content class="!pt-2">
  <ng-container
    [ngComponentOutlet]="pickerData.component"
    [ngComponentOutletInjector]="contentInjector"
  />
</mat-dialog-content>
