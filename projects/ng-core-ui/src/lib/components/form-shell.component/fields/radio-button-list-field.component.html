<div class="relative mb-5 sm:mb-4">
  @if (label()) {
    <div
      class="pointer-events-none absolute left-3 -top-[0.45rem] z-10 text-xs font-normal leading-none text-on-surface-variant"
    >
      <span [id]="labelId" class="px-1 bg-surface">
        {{ label() }}
      </span>
    </div>
  }

  <div class="flex min-h-[48px] rounded-md border border-outline bg-transparent px-3 py-2">
    <mat-radio-group
      [formField]="formField()"
      [attr.aria-labelledby]="label() ? labelId : null"
      [class]="
    inline()
      ? 'flex w-full flex-col gap-2 md:flex-row md:flex-wrap md:items-start md:gap-x-6 md:gap-y-2'
      : 'flex w-full flex-col items-start gap-2'
  "
    >
      @for (opt of resolvedOptions(); track opt.value) {
        <mat-radio-button
          class="min-w-0"
          [value]="opt.value">
          <span class="block whitespace-normal break-words leading-5">
            {{ opt.label }}
          </span>
        </mat-radio-button>
      }
    </mat-radio-group>
  </div>

  @if (formField()().touched() && formField()().errors().length) {
    <div class="px-1 pt-1 text-xs text-error">
      {{ formField()().errors()[0]?.message ?? t().field.invalid }}
    </div>
  }
</div>
